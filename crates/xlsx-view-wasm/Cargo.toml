[package]
name = "xlsx-view-wasm"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Read-only XLSX parsing and display-list wasm boundary."

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3"]

[dependencies]
ooxml-drawingml = { workspace = true, features = ["chart"] }
ooxml-opc.workspace = true
xlsx-model.workspace = true
xlsx-parse.workspace = true
xlsx-render.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
