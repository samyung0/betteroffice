[package]
name = "pptx-view-wasm"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Read-only PPTX parsing and display-list wasm boundary."

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3"]

[dependencies]
pptx-edit.workspace = true
pptx-parse.workspace = true
pptx-render.workspace = true
serde_json = "1"
wasm-bindgen = "0.2"

