[workspace]
members = ["crates/*"]
exclude = ["apps/native-viewer", "third_party/yrs"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
homepage = "https://betteroffice.dev"
repository = "https://github.com/openooxml/betteroffice"

[workspace.dependencies]
betteroffice-xlsx = { path = "crates/betteroffice-xlsx", version = "0.2.0", default-features = false }
wasm-alloc = { package = "betteroffice-wasm-alloc", path = "crates/wasm-alloc", version = "0.2.0" }
ooxml-opc = { package = "betteroffice-opc", path = "crates/ooxml-opc", version = "0.2.0", default-features = false }
xlsx-model = { package = "betteroffice-xlsx-model", path = "crates/xlsx-model", version = "0.2.0" }
xlsx-parse = { package = "betteroffice-xlsx-parse", path = "crates/xlsx-parse", version = "0.2.0" }
xlsx-calc = { package = "betteroffice-xlsx-calc", path = "crates/xlsx-calc", version = "0.2.0" }
xlsx-ops = { package = "betteroffice-xlsx-ops", path = "crates/xlsx-ops", version = "0.2.0" }
xlsx-render = { package = "betteroffice-xlsx-render", path = "crates/xlsx-render", version = "0.2.0" }
xlsx-raster = { package = "betteroffice-xlsx-raster", path = "crates/xlsx-raster", version = "0.2.0" }
ooxml-text = { package = "betteroffice-ooxml-text", path = "crates/ooxml-text", version = "0.2.0" }
ooxml-drawingml = { package = "betteroffice-drawingml", path = "crates/ooxml-drawingml", version = "0.2.0" }
docx-parse = { package = "betteroffice-docx-parse", path = "crates/docx-parse", version = "0.2.0", default-features = false }
docx-layout = { package = "betteroffice-docx-layout", path = "crates/docx-layout", version = "0.2.0" }
docx-raster = { package = "betteroffice-docx-raster", path = "crates/docx-raster", version = "0.2.0" }
docx-edit = { package = "betteroffice-docx-edit", path = "crates/docx-edit", version = "0.2.0" }
betteroffice-docx = { path = "crates/betteroffice-docx", version = "0.2.0" }
pptx-parse = { package = "betteroffice-pptx-parse", path = "crates/pptx-parse", version = "0.2.0" }
pptx-edit = { package = "betteroffice-pptx-edit", path = "crates/pptx-edit", version = "0.2.0" }
pptx-render = { package = "betteroffice-pptx-render", path = "crates/pptx-render", version = "0.2.0" }
pptx-raster = { package = "betteroffice-pptx-raster", path = "crates/pptx-raster", version = "0.2.0" }
betteroffice-pptx = { path = "crates/betteroffice-pptx", version = "0.2.0" }
vsdx-parse = { package = "betteroffice-vsdx-parse", path = "crates/vsdx-parse", version = "0.2.0" }
vsdx-formula = { package = "betteroffice-vsdx-formula", path = "crates/vsdx-formula", version = "0.2.0" }
vsdx-resolve = { package = "betteroffice-vsdx-resolve", path = "crates/vsdx-resolve", version = "0.2.0" }
vsdx-eval = { package = "betteroffice-vsdx-eval", path = "crates/vsdx-eval", version = "0.2.0" }
vsdx-render = { package = "betteroffice-vsdx-render", path = "crates/vsdx-render", version = "0.2.0" }
vsdx-raster = { package = "betteroffice-vsdx-raster", path = "crates/vsdx-raster", version = "0.2.0" }
vsdx-validate = { package = "betteroffice-vsdx-validate", path = "crates/vsdx-validate", version = "0.2.0" }
vsdx-edit = { package = "betteroffice-vsdx-edit", path = "crates/vsdx-edit", version = "0.2.0" }
betteroffice-vsdx = { path = "crates/betteroffice-vsdx", version = "0.2.0" }

# yrs 0.27.3 from crates.io (upstream y-crdt ac476a47), patched for
# BetterOffice (THIRD-PARTY-NOTICES.md lists the patches; the code is marked
# "Patched for BetterOffice"):
# - text: `clean_format_gap` (src/types/text.rs), so a delete no longer spreads
#   the deleted text's attributes onto a shared type embedded right after it,
#   such as a field or a paragraph mark; `Text::apply_delta_as_yjs`, a delta
#   whose deletions clean format items as Yjs 13.6.31's `cleanupFormattingGap`,
#   for the native Office rebase (tested in office-service);
#   `insert_attributes` and `insert_negated_attributes` write an edit's format
#   items in key order, so one edit writes the same items in every run; a
#   surrogate pair split inside gives two replacement characters as in Yjs;
# - transactions: an update and its events read the transaction's insert set
#   instead of whole state vectors, so their cost no longer grows with every
#   client the document saw; a struct integrated behind a skip (it arrived
#   before one its client wrote earlier) is in its transaction's update and
#   counts as older in later events, where upstream's state-vector diff left
#   it out; a work counter and budget (`TransactionMut::limit_work`,
#   `UpdateError::WorkBudgetExceeded`) stops integration past a budget; the
#   commit is skipped while a panic unwinds through a transaction;
# - Undo and Redo: `follow_redone` (src/store.rs) keeps the offset into a
#   redone item as Yjs does, so a position inside text Undo and Redo restored
#   stays on its unit and Undo after a delete, Undo and Redo removes only its
#   own step; `UndoManager::try_process` restores a step's items in deletion
#   order, passes an inserted item whose redone copy was collected, as Yjs
#   does, and deletes no more of a restored copy than its step inserted;
#   `Item::redo` restores a map value set concurrently with another client's
#   past only a value set concurrently that lost (deleted, its origin the
#   restored value, the winner to its right), every other value blocking as
#   in Yjs (Epo 2026-10-08 narrow Undo rule; Yjs leaves the key without a
#   value), under its own parent (Yjs #757), and Redo keeps the restored
#   value's parents as Yjs does; `clear_undo` and `clear_redo` clear only
#   their own stack;
# - garbage collection takes a collected type's children even when Undo keeps
#   them (`Item::gc`, `GCCollector::collect_marked`; upstream PR #682 for
#   #667/#676), so none is left pointing into the type's freed branch;
# - updates: `Update::decode` refuses a client's section that starts inside or
#   before an earlier one for that client, which yrs placed twice, freeing the
#   first copy; limits for hostile updates (`Any` nesting depth, no
#   reservation from a declared length, checked UTF-8, a client without
#   structs applying as nothing); pending structs are retried once the unit
#   they wait on arrives; the struct picker runs in a loop, not a call per
#   drained client; `BlockStore::push` replaces only a skip, never a block
#   already placed;
# - read-only APIs: item, branch (`start`, `item`, `entry_item`, `map_items`),
#   store (`get_item`, `get_block_range`, `blocks_in`) and update
#   (`Update::blocks`) accessors, `Store::next_live_item` (the first live item
#   right of a deleted one, for the DOCX field re-read), `Item::redone` (the
#   local link to the copy Undo made, for the DOCX marker re-anchor) and
#   `StickyIndex::get_offsets`.
# CI runs their tests in pptx-edit's yrs_memory, yrs_undo, yrs_undo_order,
# yrs_hostile, yrs_decode_alloc, yrs_placement and convergence, docx-edit's
# yrs_memory, yrs_pending, yrs_format_order, yrs_transaction_work and
# concurrent_undo, and betteroffice-xlsx's stable_collaboration. Carry the
# patches until upstream has the fixes and equivalent lookups, or the re-read
# no longer needs it; re-apply them on each yrs upgrade.
[patch.crates-io]
yrs = { path = "third_party/yrs" }

[profile.release]
opt-level = "s"
lto = true

[profile.release.package.betteroffice-docx-layout]
opt-level = 3

[profile.release.package.betteroffice-docx-parse]
opt-level = 3

# The per-keystroke hot path lives in docx-edit (engine session, frame
# encoding), ooxml-text (shaping/measurement), and yrs (text CRDT ops); the
# size-optimized workspace default measurably slows all three.
[profile.release.package.betteroffice-docx-edit]
opt-level = 3

[profile.release.package.betteroffice-ooxml-text]
opt-level = 3

[profile.release.package.yrs]
opt-level = 3

# Read-only documents are opened once in a disposable worker. opt-level 3
# throughout costs about 1% more wasm than a size-optimized viewer and lays
# out 13-16% faster.
[profile.viewer-release]
inherits = "release"
opt-level = 3
codegen-units = 1
